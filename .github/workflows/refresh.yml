name: refresh
on:
  workflow_dispatch:        # triggered by cron-job.org
  schedule:
    - cron: '13 9 * * *'   # GitHub fallback
concurrency: bot-state       # prevents two jobs corrupting state.json
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python bot.py refresh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Save state
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state: refresh" && git pull --rebase && git push)
