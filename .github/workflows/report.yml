name: report
on:
  workflow_dispatch:        # triggered by cron-job.org

concurrency: bot-state       # prevents two jobs corrupting state.json
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python bot.py report
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Save state
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: report"
          if ! (git pull --rebase && git push); then
            git rebase --abort 2>/dev/null || true
            echo "State was changed by another job; skipping this update."
          fi
          exit 0
